services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-iot_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in an untracked environment file}
      POSTGRES_DB: ${DB_NAME:-IoTDatabase}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: ../backend
    environment:
      PORT: 3000
      DB_USER: ${DB_USER:-iot_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-IoTDatabase}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      PROCESSED_DATA_PATH: ./src/mock_data/processed_data.json
      THINGSPEAK_CHANNEL_ID: ${THINGSPEAK_CHANNEL_ID:-}
      THINGSPEAK_READ_API_KEY: ${THINGSPEAK_READ_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [data, app]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  frontend:
    build:
      context: ../new-frontend/frontend
    ports: ["8080:8080"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [app]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

volumes:
  pgdata:

networks:
  app:
  data:
    internal: true
