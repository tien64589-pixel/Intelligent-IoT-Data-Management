name: Semgrep
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan source code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install semgrep==1.177.0
      - name: Scan with explicit rules
        run: semgrep scan --config p/ci --error --strict --metrics=off --sarif-output=semgrep.sarif .
      - name: Upload results
        if: >-
          ${{ !cancelled() && hashFiles('semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          sarif_file: semgrep.sarif
          category: semgrep
