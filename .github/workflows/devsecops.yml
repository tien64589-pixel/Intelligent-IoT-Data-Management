name: DevSecOps Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  node-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, new-frontend/frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.project }}
      - if: matrix.project == 'new-frontend/frontend'
        run: npm run lint && npm run build
        working-directory: ${{ matrix.project }}

  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r data_science/requirements.txt

  container-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          DB_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          REFRESH_TOKEN_SECRET: ci-only-refresh-secret-with-at-least-32-characters
        run: docker compose -f Docker/docker-compose.yaml config --quiet
      - name: Build application images
        env:
          DB_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          REFRESH_TOKEN_SECRET: ci-only-refresh-secret-with-at-least-32-characters
        run: docker compose -f Docker/docker-compose.yaml build
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-backend:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
