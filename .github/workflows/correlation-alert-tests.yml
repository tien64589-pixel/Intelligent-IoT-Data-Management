name: Correlation Alert Tests

on:
  push:
    paths:
      - "correlation_alert/**"
      - ".github/workflows/correlation-alert-tests.yml"
  pull_request:
    paths:
      - "correlation_alert/**"
      - ".github/workflows/correlation-alert-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: correlation_alert/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r correlation_alert/requirements.txt

      - name: Run correlation tests
        run: python -m pytest correlation_alert/tests -q
